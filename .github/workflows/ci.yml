name: CI MLflow Project

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: bank-marketing-model
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  retrain:
    runs-on: ubuntu-24.04  # Python 3.12.7 tersedia di image ini
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==1.26.4 scipy==1.13.1

      - name: Run MLflow Project
        working-directory: MLProject
        run: mlflow run . --env-manager=local --experiment-name "Bank Marketing CI"

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(cat MLProject/last_run_id.txt)
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Run ID terbaru: $RUN_ID"

      - name: Collect model artifacts
        run: |
          ARTIFACT_DIR=$(find MLProject/mlruns -type d -path "*/$RUN_ID/artifacts" | head -n 1)
          rm -rf artifacts && mkdir -p artifacts
          cp -r "$ARTIFACT_DIR"/. artifacts/
          echo "$RUN_ID" > artifacts/run_id.txt
          ls -R artifacts | head -n 40

      - name: Upload artifacts (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: artifacts/

      - name: Upload artifacts to GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then
            echo "Artefak tidak berubah."
          else
            git commit -m "Simpan artefak model hasil re-training ($RUN_ID) [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Build Docker Model
        if: env.DOCKER_HUB_USERNAME != ''
        working-directory: MLProject
        run: mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "$IMAGE_NAME"

      - name: Log in to Docker Hub
        if: env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        if: env.DOCKER_HUB_USERNAME != ''
        run: |
          docker tag "$IMAGE_NAME" "$DOCKER_HUB_USERNAME/$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME" "$DOCKER_HUB_USERNAME/$IMAGE_NAME:$RUN_ID"

      - name: Push Docker Image
        if: env.DOCKER_HUB_USERNAME != ''
        run: |
          docker push "$DOCKER_HUB_USERNAME/$IMAGE_NAME:latest"
          docker push "$DOCKER_HUB_USERNAME/$IMAGE_NAME:$RUN_ID"
